# T1 Touch Bar: skip the ASOC.SOCW(1) ACPI power-on — it HARD-FREEZES the
# MacBookPro14,3 T1 at module load. (The key finding; see ../README.md / the guide.)
options apple_ibridge skip_acpi_power=1

# Optional: dim the Touch Bar after 15 s without input and turn it off after 30 s
# (seconds; -1 = never). The driver default is off after 5 min. Rebuild the
# initramfs after changing this, the driver loads from it.
#options apple_touchbar dim_timeout=15 idle_timeout=30
